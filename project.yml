name: Panna
options:
  bundleIdPrefix: com.malik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PannaCore:
    path: Packages/PannaCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Panna:
    type: application
    platform: iOS
    sources:
      - path: Panna
    dependencies:
      - package: PannaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malik.panna
        # Device test builds run the real per-pixel work (kit recolour) at release speed.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        PRODUCT_NAME: Panna
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PANNA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save your best goals as clips."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  PannaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PannaTests
    dependencies:
      - target: Panna
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.malik.panna.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Panna.app/Panna"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Panna:
    build:
      targets:
        Panna: all
        PannaTests: [test]
    run:
      storeKitConfiguration: Panna/Resources/Panna.storekit
    test:
      targets:
        - PannaTests
